{% extends 'base.html' %}

{% block title %}{{ t('error.title', code=error_code) }} - IDS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-5 animate-fade-in-up">
        <div class="ai-card text-center p-5">
            <div class="mb-4">
                <i class="fas fa-circle-exclamation" style="font-size: 5rem; color: var(--ai-danger); opacity: 0.8;"></i>
            </div>
            <h1 class="display-1 fw-bold mb-2" style="font-size: 6rem; background: linear-gradient(135deg, var(--ai-danger), #f87171); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
                {{ error_code }}
            </h1>
            <h3 class="mb-4" style="color: var(--text-secondary);">{{ error_message }}</h3>
            <p class="mb-4" style="color: var(--text-muted);">
                {{ t('error.description') }}
            </p>
            <a href="{{ url_for('index') }}" class="ai-btn ai-btn-primary ai-btn-lg">
                <i class="fas fa-house me-2"></i>
                {{ t('error.back_home') }}
            </a>
        </div>
    </div>
</div>
{% endblock %}
